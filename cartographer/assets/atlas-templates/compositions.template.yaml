# {{project_name}} - Pattern Compositions
# Multi-pattern task sequences for lifecycle command guidance
# Generated by Cartographer v1.0.0
# Last Updated: {{timestamp}}

version: "1.0"

# Standard compositions for common multi-layer tasks
compositions:
{{#each compositions}}
  {{this.id}}:
    description: "{{this.description}}"

    # Ordered sequence of patterns to implement
    patterns:
{{#each this.patterns}}
      - pattern: {{this.pattern}}
        order: {{this.order}}
{{#if this.condition}}
        condition: "{{this.condition}}"
{{/if}}
{{/each}}

    # Validation sequence after implementation
    validation_sequence:
{{#each this.validation_sequence}}
      - "{{this}}"
{{/each}}

{{#if this.notes}}
    notes: "{{this.notes}}"
{{/if}}

{{/each}}

# Detected file change correlations (from git history analysis)
# Patterns that frequently change together suggest implicit compositions
{{#if detected_correlations}}
detected_correlations:
{{#each detected_correlations}}
  - files_commonly_changed_together:
{{#each this.files}}
      - "{{this}}"
{{/each}}
    suggested_composition: "{{this.suggested_composition}}"
    confidence: {{this.confidence}}

{{/each}}
{{/if}}
