# {{project_name}} - Codebase Conventions
# Machine-readable conventions for lifecycle command auto-injection
# Generated by Cartographer v1.0.0
# Last Updated: {{timestamp}}

version: "1.0"

# Keyword lookup table for pattern matching
# Maps user-facing keywords to internal pattern IDs
keyword_index:
{{#each keyword_index}}
  {{this.keyword}}: {{this.pattern_id}}
{{/each}}

# Pattern-specific conventions (codebase-specific facts only)
patterns:
{{#each patterns}}
  {{this.id}}:
    # Discovery keywords for this pattern
    keywords:
{{#each this.keywords}}
      - {{this}}
{{/each}}

    # File naming conventions (codebase-specific)
    file_convention: "{{this.file_convention}}"
{{#if this.test_convention}}
    test_convention: "{{this.test_convention}}"
{{/if}}

{{#if this.registration}}
    # Registration steps (where to wire up new instances)
    registration:
{{#each this.registration}}
      - file: "{{this.file}}"
        action: "{{this.action}}"
{{/each}}
{{/if}}

    # Validation commands (from package.json/Makefile)
    validation_commands:
{{#each this.validation_commands}}
      - "{{this}}"
{{/each}}

    # Reference to full pattern guide
    pattern_file: "patterns/{{this.id}}.md"

{{#if this.example_files}}
    # Actual examples in this codebase
    example_files:
{{#each this.example_files}}
      - "{{this}}"
{{/each}}
{{/if}}

{{#if this.related}}
    # Related patterns (for composition hints)
    related:
{{#each this.related}}
      - {{this}}
{{/each}}
{{/if}}

{{/each}}
